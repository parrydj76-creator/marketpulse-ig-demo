<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse AI v80</title><style>body{margin:0;background:#0b1322;color:#eef4ff;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px}h1{font-size:26px}section{background:#15243a;border:1px solid #30405a;border-radius:14px;padding:18px;margin:14px 0}button{background:#f5c742;color:#111;border:0;border-radius:9px;padding:11px 18px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}small{color:#b9c8dc}.warn{color:#ffb88a}</style></head><body><main><h1>MarketPulse AI v80</h1><p class="warn">READ-ONLY / SIMULATION RESEARCH — IG broker orders disabled</p><section><label for="token">Admin token (used only for this request; not stored)</label><p><input id="token" type="password" autocomplete="off" style="width:95%;padding:10px" /></p><button id="run">Run read-only audit</button></section><section><h2>Certification evidence</h2><small>Financial, feed and broker lifecycle blockers remain fail-closed.</small><pre id="out">Enter your admin token, then run the audit.</pre></section></main><script>document.getElementById('run').onclick=async()=>{const out=document.getElementById('out');out.textContent='Running...';try{const r=await fetch('/api/v80/audit',{method:'POST',headers:{'X-Admin-Token':document.getElementById('token').value,'Content-Type':'application/json'},body:'{}',cache:'no-store'});const d=await r.json();out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent='Audit request failed: '+e.message}};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MarketPulse v81 Paper Simulation</title><style>body{font:16px system-ui;background:#0d1524;color:#eaf1ff;margin:0;padding:22px}main{max-width:760px;margin:auto}.panel{background:#17253a;border:1px solid #34455c;border-radius:14px;padding:18px;margin:16px 0}input,button{font:inherit;padding:11px;border-radius:8px}input{background:#101b2b;color:white;border:1px solid #53667f;width:60%}button{background:#f9c846;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#a8bdd5}.warning{color:#ffd078}</style></head><body><main><h1>MarketPulse AI v81</h1><p class="warning">PAPER SIMULATION ONLY · IG broker orders hard-blocked · £1/pip/unit is an unverified simulation assumption</p><div class="panel"><label>Admin token (kept only in this page's memory)</label><p><input id="token" type="password" autocomplete="off" placeholder="Admin token"> <button id="load">Refresh</button></p><small>Token is not saved to local storage.</small></div><div class="panel"><h2>Paper engine</h2><pre id="result">Enter your token and select Refresh.</pre></div><script>document.getElementById('load').onclick=async()=>{const out=document.getElementById('result');try{const r=await fetch('/api/v81/status',{headers:{'X-Admin-Token':document.getElementById('token').value},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e.message)}}</script></main></body></html>

services:
  - type: web
    name: marketpulse-ig-demo-v33
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: IG_ACCOUNT_TYPE
        value: DEMO
      - key: IG_API_KEY
        sync: false
      - key: IG_USERNAME
        sync: false
      - key: IG_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false

<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v36 Paper</title><style>body{font:16px system-ui;background:#0b1020;color:#eef;padding:24px;max-width:850px;margin:auto}button{padding:12px;margin:5px;background:#ffd24d;border:0;border-radius:8px}pre{white-space:pre-wrap;background:#17213b;padding:16px;border-radius:12px}</style></head><body><h1>MarketPulse AI v36</h1><p>Paper positions only — no broker orders. Illustrative GBP pip-value assumption.</p><p>Enter admin token for this session (not saved).</p><input type="password" id="token" placeholder="Admin token"><p><button onclick="call('GET','status')">Refresh</button><button onclick="call('POST','paper/cycle')">Evaluate now</button><button onclick="call('POST','paper/start')">Start paper</button><button onclick="call('POST','paper/stop')">Stop paper</button><button onclick="call('GET','trades')">Trades</button></p><pre id="out">Enter token and refresh</pre><script>async function call(method,route){try{const r=await fetch('/api/v36/'+route,{method,headers:{'X-Admin-Token':document.getElementById('token').value}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById('out').textContent=String(e)}}</script></body></html>

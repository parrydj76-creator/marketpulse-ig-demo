<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v40</title><style>body{font:16px system-ui;background:#0c1421;color:#e5edf8;margin:0;padding:24px}main{max-width:900px;margin:auto}.panel{border:1px solid #314158;border-radius:14px;padding:18px;margin:16px 0;background:#172338}h1{color:#8ac8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}button{padding:12px;background:#4c93d9;color:white;border:0;border-radius:8px}small{color:#aabbd0}</style></head><body><main><h1>MarketPulse AI v40</h1><p>IG demo order-protocol rehearsal. <strong>No broker order submission.</strong></p><div class="panel"><h2>Readiness and recovery</h2><button onclick="refresh()">Refresh</button><pre id="status">Loading…</pre></div><div class="panel"><h2>Durable simulated intents</h2><pre id="intents">Loading…</pre></div><small>All transitions are simulated. A successful rehearsal does not certify IG sizing, execution, or crash recovery.</small></main><script>async function refresh(){for(const key of ['status','intents']){try{const r=await fetch('/api/v40/'+key,{cache:'no-store'});document.getElementById(key).textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById(key).textContent=e.message}}}refresh()</script></body></html>

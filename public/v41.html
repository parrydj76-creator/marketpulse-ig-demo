<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v41 | IG DEMO Observer</title><style>body{background:#101827;color:#e7edf5;font:16px system-ui;margin:0;padding:24px;max-width:850px}h1{color:#75caff}button{background:#1570ef;border:0;border-radius:8px;color:white;padding:12px 18px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d2a3d;padding:20px;border-radius:10px}p{line-height:1.5}.warn{color:#ffc46b}</style></head><body><h1>MarketPulse AI v41</h1><p>IG DEMO read-only broker observer</p><p class="warn">No IG orders can be submitted by v41. Observation is not GBP sizing or broker lifecycle certification.</p><button id="refresh">Refresh IG observation</button><button id="status">Show status</button><pre id="output">Use Refresh to retrieve IG DEMO positions and dealing rules.</pre><script>async function run(route,method){let o=document.getElementById('output');o.textContent='Checking...';try{let r=await fetch(route,{method,headers:{'Accept':'application/json'}});o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent=e.message}}document.getElementById('refresh').onclick=()=>run('/api/v41/observe','POST');document.getElementById('status').onclick=()=>run('/api/v41/status','GET');</script></body></html>

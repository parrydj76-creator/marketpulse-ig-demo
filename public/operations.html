<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v25.0</title><style>body{background:#0b1120;color:#e5edff;font:16px system-ui;margin:24px}section{background:#151e30;border:1px solid #34425a;border-radius:12px;padding:20px;margin:16px 0}button,input{padding:10px;background:#254b80;color:white;border:1px solid #50698e;border-radius:6px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #34425a}.warn{color:#ffc66d}</style><h1>MarketPulse v25.0</h1><p class="warn">IG DEMO · Broker execution hard-blocked</p><section><input id="token" type="password" placeholder="Admin token" autocomplete="off"><button id="connect">Connect</button><p id="error"></p></section><section><h2>Core health</h2><pre id="health">Not connected</pre><table><thead><tr><th>Pair</th><th>Feed</th><th>Bars</th><th>Signal</th><th>Score</th></tr></thead><tbody id="pairs"></tbody></table></section><section><h2>Shadow journal</h2><pre id="shadow"></pre></section><section><h2>Verification workbench</h2><button id="risk">Inspect FX conversions and positions</button><button id="contracts">Read IG contract units</button><button id="recovery">Run isolated child-process crash test</button><pre id="result"></pre><p>Read-only broker inspection. Crash test uses a temporary local journal, not IG orders. No broker certification.</p></section><script>
const $=id=>document.getElementById(id);let secret='',busy=false;async function call(route,method='GET'){const r=await fetch(route,{method,headers:{'X-Admin-Token':secret},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}async function refresh(){if(!secret||busy)return;busy=true;try{const d=await call('/api/admin/v250/status'),r=d.readiness;$('health').textContent=JSON.stringify({version:d.version,RAM:r.memory.rssMB,heap:r.memory.heapUsedMB,fresh:r.markets.filter(x=>x.streamFresh).length,ready:r.markets.filter(x=>x.consecutive30).length,legacyBundleLoaded:d.legacyBundleLoaded,loadedModules:d.loadedModules,safety:d.safety,blockers:r.blockers},null,2);$('pairs').replaceChildren();for(const p of r.markets){const tr=document.createElement('tr');for(const v of [p.name,p.streamFresh?'Fresh':'Stale',p.bars,p.direction,p.score]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('pairs').append(tr)}$('shadow').textContent=JSON.stringify(d.shadow,null,2);$('error').textContent='Connected'}catch(e){$('error').textContent=e.message}finally{busy=false}}$('connect').onclick=()=>{secret=$('token').value;$('token').value='';refresh()};for(const [id,route,method] of [['risk','/api/admin/v95/inspect','POST'],['contracts','/api/admin/v250/contracts','GET'],['recovery','/api/admin/v250/recovery','POST']]){$(id).onclick=async()=>{if(!secret)return;$(id).disabled=true;try{$('result').textContent=JSON.stringify(await call(route,method),null,2)}catch(e){$('result').textContent=e.message}finally{$(id).disabled=false}}}setInterval(refresh,15000);
</script></html>

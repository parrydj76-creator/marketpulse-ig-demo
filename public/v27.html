<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v27</title><style>body{background:#101827;color:#f2f5fb;font:16px system-ui;margin:auto;max-width:720px;padding:24px}button,input{padding:12px;border-radius:8px;margin:6px 0}button{background:#35a8e0;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2a40;padding:16px;border-radius:10px}</style><h1>MarketPulse v27</h1><p>Read-only readiness and synthetic failure lab. Broker execution hard-blocked.</p><label>Admin token (not saved) <input id="token" type="password" autocomplete="off"></label><p><button onclick="call('/api/v27/status')">Status</button> <button onclick="call('/api/v27/preflight','POST')">Record preflight</button> <button onclick="call('/api/v27/failure-lab','POST')">Synthetic failure lab</button></p><pre id="out">Select an action</pre><script>async function call(url,method='GET'){const out=document.getElementById('out');try{const r=await fetch(url,{method,headers:{'X-Admin-Token':document.getElementById('token').value}});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}}</script></html>

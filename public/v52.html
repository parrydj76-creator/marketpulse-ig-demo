<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse AI v52</title><style>body{background:#0c1425;color:#f2f5fa;font:16px system-ui;margin:auto;max-width:850px;padding:24px}section{background:#19243a;border-radius:14px;padding:20px;margin:14px 0}button,input{padding:12px;border-radius:8px;border:1px solid #64748b}button{background:#facc15;color:#151515;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#aab8cd}</style></head><body><h1>MarketPulse AI · v52</h1><p>EUR/USD Mini · IG DEMO · Read-only certification</p><section><strong>Broker execution: HARD_BLOCKED</strong><p><small>Risk estimates, confirmations and position readbacks do not certify unattended trading.</small></p></section><section><label>Admin token (kept in this page only) <input id="token" type="password" autocomplete="off"></label><p><button onclick="request('GET','/api/v52/status')">Status</button> <button onclick="request('POST','/api/v52/inspect')">Inspect Mini</button> <button onclick="request('POST','/api/v52/risk-preview',{})">Risk preview</button> <button onclick="request('GET','/api/v52/transactions')">Transaction history</button></p></section><section><pre id="result">Choose an action above.</pre></section><script>async function request(method,url,body){const out=document.getElementById('result');out.textContent='Loading…';try{const r=await fetch(url,{method,headers:{'X-Admin-Token':document.getElementById('token').value,'Content-Type':'application/json'},...(method==='POST'?{body:JSON.stringify(body||{})}:{})});const data=await r.json();out.textContent=JSON.stringify(data,null,2)}catch(e){out.textContent=String(e)}}</script></body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v26</title><style>body{font:16px system-ui;background:#0d1421;color:#edf4ff;max-width:760px;margin:auto;padding:24px}section{background:#182337;padding:20px;border-radius:16px;margin:15px 0}input,button{padding:12px;border-radius:8px}button{background:#56d7ac;border:0;cursor:pointer}li{padding:9px;border-bottom:1px solid #39465a}.yes{color:#56d7ac}.no{color:#ff9e9e}small{color:#bac7db}</style><h1>MarketPulse AI v26</h1><p>Autonomous simulation & broker-readiness diagnostics</p><section><p>Broker orders: <strong class="no">HARD BLOCKED</strong></p><label>Admin token (held only in this page's memory): <input type="password" id="token" autocomplete="off"></label> <button id="check">Run preflight</button></section><section id="result">Enter your admin token and run preflight. No orders will be placed.</section><script>document.getElementById('check').onclick=async()=>{let el=document.getElementById('result');el.textContent='Checking…';try{let r=await fetch('/api/v26/preflight',{method:'POST',headers:{'X-Admin-Token':document.getElementById('token').value}});let x=await r.json();if(!r.ok)throw Error(x.error||'HTTP '+r.status);el.replaceChildren();let h=document.createElement('h2');h.textContent=x.passed+'/'+x.total+' readiness checks passed';el.append(h);let p=document.createElement('p');p.textContent='Simulation: '+(x.simulation.paused?'PAUSED':'RUNNING')+' · Stream: '+x.feed.streamStatus;el.append(p);let ul=document.createElement('ul');for(let c of x.checks){let li=document.createElement('li');li.className=c.pass?'yes':'no';li.textContent=(c.pass?'PASS':'BLOCKED')+' — '+c.description;ul.append(li)}el.append(ul);let note=document.createElement('small');note.textContent=x.warning;el.append(note)}catch(e){el.textContent='Preflight error: '+e.message}};</script></html>

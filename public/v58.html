<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse v58 · Paper dashboard</title><style>body{background:#10151d;color:#e9eef6;font:16px system-ui;margin:0;padding:22px;max-width:1000px;margin:auto}h1{font-size:26px}p,.muted{color:#aab7c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#1d2734;padding:18px;border-radius:12px;margin:12px 0}strong{font-size:23px}button{padding:12px 16px;margin:5px 5px 5px 0;background:#e6b83d;border:0;border-radius:8px;font-weight:700}button.secondary{background:#aab7c7}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #374250}small{color:#aab7c7}#error{color:#ff9e9e}input{padding:12px;width:min(100%,430px);box-sizing:border-box}</style></head><body><h1>MarketPulse AI · v58</h1><p>Paper simulator only. CFD proxy prices, hypothetical P/L. No IG dealing orders.</p><div class="card"><label>Admin token (stored in this page's memory only) <input id="token" type="password" autocomplete="off" placeholder="Paste token for this session"></label><button onclick="refresh()">Refresh</button><p id="error"></p></div><div class="grid" id="metrics"></div><div class="card"><h2>Paper controls</h2><button onclick="act('arm-monitor')">Monitor positions</button><button onclick="act('arm-entries')">Monitor + paper entries</button><button class="secondary" onclick="act('stop')">Disarm</button><button class="secondary" onclick="act('cycle')">Evaluate now</button><p id="decision" class="muted"></p></div><div class="card"><h2>Open paper positions</h2><div id="positions"></div></div><div class="card"><h2>Closed paper trades</h2><div id="closed"></div></div><p class="muted">After a restart, monitoring and entries are disarmed until explicitly rearmed. No browser-side auto-arming.</p><script>
const $=x=>document.getElementById(x);const safe=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(url,method='GET'){const r=await fetch(url,{method,headers:{'X-Admin-Token':$('token').value,'Content-Type':'application/json'},body:method==='POST'?'{}':undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}function card(k,v){return `<div class="card"><small>${safe(k)}</small><br><strong>${safe(v)}</strong></div>`}async function refresh(){try{const s=await req('/api/v58/status');$('error').textContent='';const p=s.performance;$('metrics').innerHTML=[['Monitoring',s.monitorArmed?'ARMED':'OFF'],['Paper entries',s.entryArmed?'ARMED':'OFF'],['Open positions',s.openPaperPositions],['Closed trades',p.closedTrades],['Win rate',p.winRatePct==null?'—':p.winRatePct+'%'],['Realised P/L','£'+p.realisedPnlGBP],['Today’s trades',s.tradesToday],['Today’s losses','£'+s.lossGBP],['Quote',s.quoteStatus.valid?'FRESH':'UNAVAILABLE']].map(x=>card(...x)).join('');$('decision').textContent=JSON.stringify(s.lastReview||s.quoteStatus);$('positions').innerHTML=s.openPaper.length?s.openPaper.map(x=>`<p><b>${safe(x.direction)} ${safe(x.epic)}</b> · Entry ${safe(x.entry)} · Stop ${safe(x.stop)} · Target ${safe(x.target)} · Mark ${safe(x.mark?.unrealisedPnlGBP==null?'Unavailable':'£'+x.mark.unrealisedPnlGBP)}</p>`).join(''):'No open paper positions';$('closed').innerHTML=p.recentClosed.length?'<table><tr><th>Time</th><th>Reason</th><th>Exit</th><th>P/L</th></tr>'+p.recentClosed.map(x=>`<tr><td>${safe(x.at)}</td><td>${safe(x.reason)}</td><td>${safe(x.exitPrice)}</td><td>£${safe(x.pnlGBP)}</td></tr>`).join('')+'</table>':'No closed paper trades';}catch(e){$('error').textContent=e.message}}async function act(name){try{const d=await req('/api/v58/'+name,'POST');$('decision').textContent=JSON.stringify(d);await refresh()}catch(e){$('error').textContent=e.message}}setInterval(()=>{if($('token').value)refresh()},15000);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse AI v34</title><style>body{font:16px system-ui;background:#0b1324;color:#edf4ff;max-width:760px;margin:25px auto;padding:16px}section{background:#17223a;border-radius:14px;padding:20px;margin:16px 0}button,input{font:inherit;padding:11px;border-radius:8px;margin:5px}button{background:#d7b340;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9c6d9}</style></head><body><h1>MarketPulse AI v34</h1><p>Paper automation readiness • IG demo broker writes HARD BLOCKED</p><section><label>Admin token <input id="token" type="password" autocomplete="off" placeholder="Enter token"></label><p><button onclick="call('/api/v34/status')">Status</button><button onclick="call('/api/v34/paper/start','POST')">Start paper cycle</button><button onclick="call('/api/v34/paper/stop','POST')">Stop paper cycle</button></p><p><button onclick="call('/api/v34/paper/cycle','POST')">Evaluate now</button><button onclick="call('/api/v34/events')">Recent events</button><button onclick="call('/api/v34/broker/observe','POST')">Observe IG demo</button></p><small>Paper mode resets to OFF on every restart. No live or demo broker orders are submitted.</small></section><section><pre id="output">Enter your admin token and select Status.</pre></section><script>async function call(url,method='GET'){const output=document.getElementById('output');try{const response=await fetch(url,{method,headers:{'X-Admin-Token':document.getElementById('token').value}});output.textContent=JSON.stringify(await response.json(),null,2)}catch(e){output.textContent=String(e)}}</script></body></html>

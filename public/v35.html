<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse AI v35</title><style>body{font:16px system-ui;background:#101827;color:#edf3ff;margin:0;padding:22px;max-width:900px}h1{color:#70e0c4}.panel{background:#1d293a;border:1px solid #34455a;border-radius:14px;padding:18px;margin:15px 0}button,input{font:inherit;padding:12px;border-radius:8px}button{background:#70e0c4;border:0;cursor:pointer}input{background:#101827;color:white;border:1px solid #677}.bad{color:#ff9d9d}.good{color:#70e0c4}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9c8dc}</style></head><body><h1>MarketPulse AI v35</h1><p>Read-only paper readiness dashboard. No broker execution controls.</p><div class="panel"><label>Admin token (held only in this page's memory): <input id="token" type="password" autocomplete="off"></label> <button id="refresh">Refresh</button></div><div class="panel" id="summary">Enter your admin token and refresh.</div><div class="panel"><h2>Diagnostics</h2><pre id="details"></pre></div><small>Never share your admin token. Page refresh clears the token.</small><script>document.getElementById('refresh').onclick=async()=>{const el=document.getElementById('summary');try{const r=await fetch('/api/v35/status',{headers:{'X-Admin-Token':document.getElementById('token').value},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();el.textContent='Order intent gate: '+d.orderIntentGate+' | Paper cycles: '+d.paperCycles+' | Broker orders: BLOCKED';document.getElementById('details').textContent=JSON.stringify(d,null,2)}catch(e){el.textContent='Unable to load diagnostics: '+e.message}}</script></body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse AI V5.6 — Paper</title><style>body{font:16px system-ui;background:#101923;color:#f2f6fa;margin:0;padding:20px}main{max-width:720px;margin:auto}section{background:#1b2a39;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:24px}.muted{color:#aebecd}.warn{color:#ffcc7a}pre{white-space:pre-wrap;overflow-wrap:anywhere}b{color:#77e2b1}</style><main><h1>MarketPulse AI <b>V5.6</b></h1><p class="warn">PAPER TRADING ONLY · No IG orders · Render Free can sleep and reset results</p><section><h2>Live signal</h2><div id="signal">Loading…</div></section><section><h2>Simulated position</h2><div id="position">Loading…</div></section><section><h2>Paper performance</h2><div id="perf">Loading…</div></section><section><h2>Recent simulated activity</h2><pre id="history">Loading…</pre></section><p class="muted">Updates every 15 seconds. Data is volatile. Not investment advice.</p></main><script>async function load(){try{let r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),m=d.markets?.find(x=>x.epic==='CS.D.EURUSD.CFD.IP'),p=d.paper||{};document.querySelector('#signal').textContent=`${m?.direction||'WAIT'} | score ${m?.score||0} | ${m?.bars||0}/30 bars | ${m?.priceSource||'NO FEED'} | bid ${m?.bid??'-'} / ask ${m?.ask??'-'}`;document.querySelector('#position').textContent=p.position?`${p.position.direction} @ ${p.position.entry} (${p.position.openedAt})`:'None';document.querySelector('#perf').textContent=`Simulated realized: ${p.realizedPips??0} pips | Entries today: ${p.dailyOpens??0}/${p.config?.dailyCap??2}`;document.querySelector('#history').textContent=(p.history||[]).slice(0,12).map(x=>JSON.stringify(x)).join('\n')||'No simulated trades yet';}catch(e){document.querySelector('#signal').textContent='Connection error: '+e.message}}load();setInterval(load,15000)</script></html>
